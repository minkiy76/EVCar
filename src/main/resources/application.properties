# ===== 업비트 자동매매 =====
# API 키는 절대 이 파일에 직접 쓰지 말고 환경변수로 주입하세요.
upbit.api.base-url=https://api.upbit.com
upbit.api.access-key=${UPBIT_ACCESS_KEY:}
upbit.api.secret-key=${UPBIT_SECRET_KEY:}
# PAPER: 모의투자(기본), LIVE: 실거래 (반드시 소액으로 검증 후 사용)
upbit.trading.mode=PAPER
upbit.trading.market=KRW-BTC
# VOLATILITY_BREAKOUT | MA_CROSS
upbit.trading.strategy=VOLATILITY_BREAKOUT
upbit.trading.interval-ms=60000
upbit.trading.auto-start=false
upbit.trading.order-krw=10000
upbit.trading.max-order-krw=50000
upbit.trading.paper-seed-krw=1000000
upbit.trading.stop-loss-pct=3.0
upbit.trading.take-profit-pct=6.0
upbit.trading.daily-loss-limit-krw=30000
upbit.trading.breakout-k=0.5
upbit.trading.ma-short-period=5
upbit.trading.ma-long-period=20
# 차트 분석 기반 종목 자동 선택 (false면 upbit.trading.market 고정)
upbit.trading.auto-select=true
# 스캔 후보 종목 (비우면 KRW 마켓 거래대금 상위 pool-size개 자동 선정)
upbit.trading.scanner.markets=KRW-BTC,KRW-ETH,KRW-SOL,KRW-XRP,KRW-ADA,KRW-DOGE,KRW-AVAX,KRW-LINK,KRW-DOT,KRW-TRX
upbit.trading.scanner.pool-size=10
upbit.trading.scanner.rsi-max=70
upbit.trading.scanner.trend-ma-period=20

